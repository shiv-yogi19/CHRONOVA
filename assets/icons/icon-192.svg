<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#07080e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#9b51e0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)" stroke="url(#ring)" stroke-width="4"/>
  
  <!-- Glowing orbit ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="8" stroke-dasharray="12 18" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Inner Glass Dial -->
  <circle cx="256" cy="256" r="130" fill="url(#glass)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- Clock ticks -->
  <line x1="256" y1="136" x2="256" y2="152" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  <line x1="376" y1="256" x2="360" y2="256" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="376" x2="256" y2="360" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  <line x1="136" y1="256" x2="152" y2="256" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Chronova Stylized C & Digital Digits -->
  <path d="M 280 180 A 80 80 0 1 0 280 332" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="200" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="310" y2="256" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="8" fill="#00f2fe" filter="url(#glow)"/>
  
  <!-- Creator branding tiny dot -->
  <text x="256" y="420" font-family="'Orbitron', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6">CHRONOVA</text>
  <text x="256" y="445" font-family="sans-serif" font-size="12" font-weight="500" fill="#00f2fe" text-anchor="middle" letter-spacing="2">SHIV YOGI</text>
</svg>
